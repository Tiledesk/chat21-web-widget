<form [formGroup]="form">
  <div class="form-group label-floating" [id]="'wrap-' + fieldBaseId" #div_input
    [ngClass]="{'is-empty': !form?.controls[element.name]?.value}">
    <label class="control-label" [attr.for]="fieldBaseId">
      {{element?.text}}
    </label>
    <textarea
      [id]="fieldBaseId"
      [formControlName]="$safeNavigationMigration(element?.name)"
      [rows]="rows"
      [tabIndex]="$safeNavigationMigration(element?.tabIndex)"
      type="text"
      class="form-control"
      [attr.aria-required]="element?.mandatory ? 'true' : null"
      [attr.aria-invalid]="ariaInvalid"
      [attr.aria-describedby]="ariaDescribedByErrors"
      (keydown)="onkeydown($event)"
      (keydown.enter)="onEnterPressed($event)"
      (focus)="onFocus()"
      (focusout)="onFocusOut()">
    </textarea>
  </div>
  @if (hasSubmitted && form?.controls[element.name]?.errors) {
    <div [id]="errorsId" class="text-danger" role="alert">
      @if (form?.controls[element.name].hasError('required')) {
        <span>{{translationErrorLabelMap.get('LABEL_ERROR_FIELD_REQUIRED')}}</span>
      }
      @if (form?.controls[element.name].hasError('pattern') && element?.errorLabel) {
        <span>{{element.errorLabel}}</span>
      }
    </div>
  }
</form>
