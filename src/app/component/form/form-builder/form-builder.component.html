<div>
  <form id="chat21-form-container" [formGroup]="preChatFormGroupCustom">
    @for (element of formArray; track element) {
      <span>
        @if (element?.type === 'text') {
          <chat-form-text
            [element]="element"
            [controlName]="$safeNavigationMigration(element?.name)"
            [translationErrorLabelMap]="translationErrorLabelMap"
            [stylesMap]="stylesMap"
            [hasSubmitted]="submitted"
            (onKeyEnterPressed)="onEnterButtonPressed($event)">
          </chat-form-text>
        }
        @if (element?.type === 'static') {
          <chat-form-label
            [element]="element"
            [controlName]="$safeNavigationMigration(element?.name)"
            [hasSubmitted]="submitted"
            (onKeyEnterPressed)="onEnterButtonPressed($event)">
          </chat-form-label>
        }
        @if (element?.type === 'checkbox') {
          <chat-form-checkbox
            [element]="element"
            [controlName]="$safeNavigationMigration(element?.name)"
            [translationErrorLabelMap]="translationErrorLabelMap"
            [stylesMap]="stylesMap"
            [hasSubmitted]="submitted"
            (onKeyEnterPressed)="onEnterButtonPressed($event)">
          </chat-form-checkbox>
        }
        @if (element?.type === 'textarea') {
          <chat-form-textarea
            [element]="element"
            [controlName]="$safeNavigationMigration(element?.name)"
            [rows]="$safeNavigationMigration(element?.rows)"
            [translationErrorLabelMap]="translationErrorLabelMap"
            [stylesMap]="stylesMap"
            [hasSubmitted]="submitted"
            (onKeyEnterPressed)="onEnterButtonPressed($event)">
          </chat-form-textarea>
        }
      </span>
    }
  </form>

  <div class="c21-new-conversation">
    <button [tabindex]="lastTabIndex" type="button" class="c21-button-primary"
      (click)="onSubmitPreChatForm()"
      (keydown.enter)="onEnterButtonPressed($event)"
      [ngStyle]="{'background-color': $safeNavigationMigration(stylesMap?.get('themeColor')), 'border-color': $safeNavigationMigration(stylesMap?.get('themeColor')), 'color': $safeNavigationMigration(stylesMap?.get('foregroundColor')) }">
      <span class="v-align-center">
        <chat-icon name="send" class="icon-sm" [color]="$safeNavigationMigration(stylesMap?.get('foregroundColor'))"></chat-icon>
      </span>
      <span class="v-align-center c21-label-button">
        {{translationMap?.get('LABEL_START_NW_CONV')}}
      </span>
      <div class="clear"></div>
    </button>
  </div>
</div>
