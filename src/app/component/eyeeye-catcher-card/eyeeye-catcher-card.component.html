
<!-- ******* EYE-CATCHER CARD  - DISPLAYED ONLY IS-MOBILE IS FALSE ******** -->
<div class="eye-catcher-card scale-in-center"
  [class.mobile]="g.isMobile"
  [ngClass]="{'c21-align-left' : g.align === 'left', 'c21-align-right' : g.align !== 'left'}"
  [ngStyle]="{ 'display':g.displayEyeCatcherCard,  'bottom': g.marginY+'px', 'left':(g.align==='left')?g.marginX+'px':'', 'right':(g.align==='right')?g.marginX+'px':'' }">

  <div class="eye-catcher_row">

    <!-- ******* EYE-CATCHER CLOSE BTN IF IS-MOBILE IS FALSE ******** -->
    <div class="eye-catcher-card-close-btn-wrapper">
      <button type="button"
        class="eye-catcher-card-close-btn c21-button-clean"
        [attr.aria-label]="g.BUTTON_CLOSE_TO_ICON || 'Close'"
        (click)="closeEyeCatcherCard()">
        <chat-icon name="close" class="eye-catcher-card-close-btn-img icon-sm"></chat-icon>
      </button>
    </div>

    <button type="button"
      class="eye-catcher_column ec_left c21-button-clean"
      [attr.aria-label]="g.START_A_CONVERSATION || g.BUTTON_OPEN_CHAT"
      (click)="openChatFromEyeCatcherCard()">
      <div class="eye-catcher-card-emoticons-wrapper">
        @if (emoticon) {
          <span class="chat21-card-emoticons">{{emoticon}}</span>
        }
      </div>
    </button>

    <button type="button"
      class="eye-catcher_column ec_right c21-button-clean"
      [attr.aria-label]="g.START_A_CONVERSATION || g.BUTTON_OPEN_CHAT"
      (click)="openChatFromEyeCatcherCard()">
      <div class="eye-catcher-card-text-wrapper">
        <p class="eye-catcher-card-title">{{title}}</p>

        <!-- Click here and start chatting with us!  -->
        @if (g.calloutMsg !== '') {
          <p class="eye-catcher-card-msg">
            {{ g.calloutMsg }}
          </p>
        } @else {
          <p class="eye-catcher-card-msg">
            {{ g.CALLOUT_MSG_PLACEHOLDER }}
          </p>
        }
      </div>
    </button>

  </div>

</div>
