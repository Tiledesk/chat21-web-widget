<!-- title="{{button?.value}}" -->
<div class="button-in-msg url" (click)="actionButtonUrl()"
  (mouseover)="onMouseOver($event)" (mouseout)="onMouseOut($event)">
  @if (button?.target !== 'self') {
    <span class="icon-button-action">
      <!-- <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black" width="12px" height="12px">
      <path d="M0 0h24v24H0z" fill="none"/>
      <path d="M9 5v2h6.59L4 18.59 5.41 20 17 8.41V15h2V5z"/>
    </svg> -->
    <chat-icon name="arrow-up-right" class="icon-sm"></chat-icon>
  </span>
}
@if (button?.target === 'self') {
  <span class="icon-button-action-self">
    <!-- <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black" width="12px" height="12px">
    <path d="M0 0h24v24H0z" fill="none"/>
    <path d="M9 5v2h6.59L4 18.59 5.41 20 17 8.41V15h2V5z"/>
  </svg> -->
  <chat-icon name="arrow-right" class="icon-sm"></chat-icon>
</span>
}
{{button?.value}}
<div class="clear"></div>
</div>
