<div class="lyrics-container">

  <audio
    #audioPlayer
    (timeupdate)="onTimeUpdate()"
    style="display:none">
  </audio>

  <p class="lyrics message_innerhtml marked" #transcriptBox [style.color]="color">
    @for (w of words; track trackByIndex($index)) {
      <span
        class="word"
        [ngClass]="w.state">
        {{ w.text }}
      </span>
    }
  </p>

</div>
