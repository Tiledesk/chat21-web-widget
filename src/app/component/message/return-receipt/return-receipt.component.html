<div class="status-message">
  <!-- c21-ico-schedule -->
  @if (!status) {
    <div class="icon">
      <chat-icon name="clock" class="icon-status"></chat-icon>
    </div>
  }
  <!-- c21-ico-done -->
  @if (status == MSG_STATUS_SENT) {
    <div class="icon">
      <chat-icon name="check" class="icon-status"></chat-icon>
    </div>
  }
  <!-- c21-ico-done -->
  @if (status == MSG_STATUS_SENT_SERVER) {
    <div class="icon">
      <chat-icon name="check" class="icon-status"></chat-icon>
    </div>
  }
  <!-- c21-ico-done_all -->
  @if (status == MSG_STATUS_RETURN_RECEIPT) {
    <div class="icon">
      <chat-icon name="check-check" class="icon-status"></chat-icon>
    </div>
  }
</div>
