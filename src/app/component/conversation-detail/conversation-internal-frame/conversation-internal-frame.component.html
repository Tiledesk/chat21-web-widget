<div class="c21-iframe-container" animate.enter="td-enter-frame" animate.leave="td-leave-frame">
  <div class="c21-iframe-header c21-header" [ngStyle]="{ 'background-image': $safeNavigationMigration(stylesMap?.get('colorGradient'))}">

    <!-- ICON BACK CHAT -->
    <button type="button"
      class="c21-header-button c21-left c21-button-clean"
      [attr.aria-label]="translationMap?.get('CLOSE') || 'Close'"
      (click)="returnClose()">
      <chat-icon name="chevron-left" class="icon-lg" [color]="$safeNavigationMigration(stylesMap?.get('foregroundColor'))"></chat-icon>
    </button>

    <!-- ICON OPEN EXTERNAL -->
    @if (openExternalLinkButton) {
      <button
        type="button"
        class="c21-header-button c21-right c21-button-clean"
        aria-label="Open in a new window"
        (click)="returnOpenExternal()">
        <chat-icon name="external-link" class="icon-lg" [color]="$safeNavigationMigration(stylesMap?.get('foregroundColor'))"></chat-icon>
      </button>
    }

    <!-- TITLE HEADER -->
    <div class="c21-title" [ngStyle]="{'color': $safeNavigationMigration(stylesMap?.get('foregroundColor')) }">
      <div class="titleText">{{button?.value}}</div>
    </div>
  </div>
  <div class="c21-iframe">
    @if (!hideSpinner) {
      <div class="lds-roller" aria-hidden="true">
        <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
      </div>
    }

    <iframe id="contentFrame" #iframe
      allowfullscreen
      [title]="button?.value || 'Embedded conversation panel'"
      sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-popups-to-escape-sandbox"
      referrerpolicy="strict-origin-when-cross-origin"
      loading="lazy"
      width="100%" height="100%" style="border:none;"
      [src]="url"
      (load)="onIframeLoaded($event)"
    (error)="onError($event)"></iframe>
  </div>
</div>
