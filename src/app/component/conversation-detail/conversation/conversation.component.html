
<div id="chat21-conversation-component"
  #afConversationComponent
  role="region"
  [attr.aria-label]="g?.project?.widgetTitle"
  [class.chat21-conversation--close-stream-active]="closeStreamButtonActiveForSheetBottom()">

  <!-- Skip-link: revealed only on focus, jumps straight to the message composer (WCAG 2.4.1 Bypass Blocks). -->
  <a class="c21-skip-link" href="#chat21-main-message-context"
    (click)="$event.preventDefault(); skipToCompose()">
    {{ translationMapFooter?.get('SKIP_TO_COMPOSER') || 'Skip to message composer' }}
  </a>

  <!-- HEADER -->
  @if (!g?.hideHeaderConversation) {
    <chat-conversation-header
      [idConversation]= "conversationWith"
      [senderId]="senderId"
      [soundEnabled]="$safeNavigationMigration(g?.soundEnabled)"
      [isTrascriptDownloadEnabled]="isTrascriptDownloadEnabled"
      [hideHeaderCloseButton]="$safeNavigationMigration(g?.hideHeaderCloseButton)"
      [hideHeaderBackButton]="$safeNavigationMigration(g?.singleConversation)"
      [hideCloseConversationOptionMenu]="(isConversationArchived || g?.hideCloseConversationOptionMenu)"
      [hideHeaderConversationOptionsMenu]="$safeNavigationMigration(g?.hideHeaderConversationOptionsMenu)"
      [hideSignOutOptionMenu]="(!g?.singleConversation || !g?.showLogoutOption)"
      [hideChatDetailOptionMenu]="(!g?.isDevMode)"
      [fullscreenMode]="$safeNavigationMigration(g?.fullscreenMode)"
      [size]="$safeNavigationMigration(g?.size)"
      [stylesMap]="stylesMap"
      [translationMap]="translationMapHeader"
      [widgetTitle]="$safeNavigationMigration(g?.project?.widgetTitle)"
      [build_version]="g?.singleConversation? $safeNavigationMigration(g?.BUILD_VERSION): null"
      [windowContext]="$safeNavigationMigration(g?.windowContext)"
      [isMenuShow]="isMenuShow"
      [isTypings]="isTypings"
      [nameUserTypingNow]="nameUserTypingNow"
      [typingLocation]="$safeNavigationMigration(g?.typingLocation)"
      [isMobile]="$safeNavigationMigration(g?.isMobile)"
      (onBack)="onBackHomeFN()"
      (onCloseWidget)="onCloseWidgetFN()"
      (onMenuOptionClick)="onMenuOptionClick($event)"
      (onMenuOptionShow)="onMenuOption($event)">
    </chat-conversation-header>
  }

  <!-- Badge: natura dell'ultimo messaggio ricevuto dal server -->
  <!-- <div
  *ngIf="showLastServerSenderBadge"
  id="chat21-last-server-sender-badge"
  [ngClass]="lastServerSenderKind">
  {{ lastServerSenderBadgeText }}
</div> -->

@if (isHovering) {
  <div id="dropZone_container"
    [class.hideTextReply]="hideFooterTextReply && g?.poweredBy">
    <div class="drop">
      <!-- drop zone -->
    </div>
  </div>
}

<!-- CONTENT -->
<chat-conversation-content
  [class.hideTextReply]="hideFooterTextReply && g?.poweredBy"
  [messages]="messages"
  [senderId]="senderId"
  [baseLocation]="$safeNavigationMigration(g?.windowContext['tiledesk']?.getBaseLocation())"
  [isConversationArchived]="isConversationArchived"
  [isTypings]="isTypings"
  [idUserTypingNow]="idUserTypingNow"
  [nameUserTypingNow]="nameUserTypingNow"
  [typingLocation]="$safeNavigationMigration(g?.typingLocation)"
  [showThinkingMessage]="showThinkingMessage"
  [lastServerSenderKind]="lastServerSenderKind"
  [fullscreenMode]="$safeNavigationMigration(g?.fullscreenMode)"
  [isStreamAudioActive]="isStreamAudioActive"
  [translationMap]="translationMapContent"
  [stylesMap]="stylesMap"
  (onBeforeMessageRender)="onBeforeMessageRenderFN($event)"
  (onAfterMessageRender)="onAfterMessageRenderFN($event)"
  (onAttachmentButtonClicked)="onAttachmentButtonClicked($event)"
  (onScrollContent)="onScrollContent($event)"
  (onMenuOptionShow)="onMenuOption($event)"
  (onEmojiiPickerShow)="onEmojiiPickerShow($event)"
  (drop)="drop($event)"
  (dragover)="allowDrop($event)"
  (dragleave)="drag($event)" >
</chat-conversation-content>


<!-- INTERNAL FRAME FOR SELF ACTION LINK BUTTONS-->
@if (isButtonUrl) {
  <chat-internal-frame
    [button]="buttonClicked"
    [openExternalLinkButton]="$safeNavigationMigration(g?.openExternalLinkButton)"
    [translationMap]="translationMapHeader"
    [stylesMap]="stylesMap"
    (onOpenExternal)="onOpenExternalFrame($event)"
    (onClose)="onCloseInternalFrame($event)">
  </chat-internal-frame>
}


<!-- PREVIEW ATTACHMENT BUTTON-->
@if (isOpenAttachmentPreview) {
  <chat-conversation-attachment-preview
    [textInputTextArea]="textInputTextArea"
    [attachments]="attachments"
    [baseLocation]="$safeNavigationMigration(g?.baseLocation)"
    [translationMap]="translationMapPreview"
    [stylesMap]="stylesMap"
    (onSendAttachment)="onSendAttachment($event)"
    (onCloseModalPreview)="onCloseModalPreview()">
  </chat-conversation-attachment-preview>
}


<dialog #mydialog>
  <chat-confirm-close
    [conversationId]="conversationId"
    [translationMap]="translationMapCloseChatDialog"
    [stylesMap]="stylesMap"
    (onDiaglogClosed)="onCloseDialog($event)">
  </chat-confirm-close>
</dialog>

<!-- FOOTER -->
<div id="chat21-footer">
  @if (showBadgeScroollToBottom) {
    <button
      type="button"
      id="chat21-buttonToBottom"
      class="c21-button-clean"
      [attr.aria-label]="translationMapContent?.get('BUTTON_SCROLL_TO_BOTTOM') || 'Scroll to last message'"
      (click)="scrollToBottom()">
      <chat-icon name="chevron-down" class="icon-lg"></chat-icon>
      @if (messagesBadgeCount!=0) {
        <span id="chat21-divBudge" class="c21-divBudge" aria-hidden="true">{{messagesBadgeCount}}</span>
      }
    </button>
  }

  <chat-conversation-footer
    [conversationWith]="conversationWith"
    [attributes]="$safeNavigationMigration(g?.attributes)"
    [senderId]="senderId"
    [tenant]="$safeNavigationMigration(g?.tenant)"
    [project]="$safeNavigationMigration(g?.project)"
    [channelType]="$safeNavigationMigration(g?.channelType)"
    [userFullname]="$safeNavigationMigration(g?.userFullname)"
    [userEmail]="$safeNavigationMigration(g?.userEmail)"
    [showAttachmentFooterButton]="$safeNavigationMigration(g?.showAttachmentFooterButton)"
    [showEmojiFooterButton]="$safeNavigationMigration(g?.showEmojiFooterButton)"
    [showAudioRecorderFooterButton]="$safeNavigationMigration(g?.showAudioRecorderFooterButton)"
    [showAudioStreamFooterButton]="$safeNavigationMigration(g?.showAudioStreamFooterButton)"
    [hideTextAreaContent]="(g?.singleConversation && hideTextAreaContent) || (isConversationArchived && !g?.allowReopen)"
    [isConversationArchived]="isConversationArchived"
    [hideTextReply]="hideFooterTextReply"
    [isMobile]="$safeNavigationMigration(g?.isMobile)"
    [isEmojiiPickerShow]="isEmojiiPickerShow"
    [footerMessagePlaceholder]="footerMessagePlaceholder"
    [closeChatInConversation]="$safeNavigationMigration(g?.closeChatInConversation)"
    [fileUploadAccept]="$safeNavigationMigration(g?.fileUploadAccept)"
    [dropEvent]="dropEvent"
    [poweredBy]="$safeNavigationMigration(g?.poweredBy)"
    [stylesMap]="stylesMap"
    [translationMap]="translationMapFooter"
    (onEmojiiPickerShow)="onEmojiiPickerShow($event)"
    (onBeforeMessageSent)="onBeforeMessangeSentFN($event)"
    (onAfterSendMessage)="onAfterSendMessageFN($event)"
    (onChangeTextArea)="onChangeTextArea($event)"
    (onAttachmentFileButtonClicked)="onAttachmentFileButtonClicked($event)"
    (onNewConversationButtonClicked)="onNewConversationButtonClickedFN($event)"
    (onStreamAudioActiveChange)="onStreamAudioActiveChange($event)"
    (onStreamAudioConnectingChange)="onStreamAudioConnectingChange($event)"
    (onCloseChatButtonClicked)="onCloseChatButtonClickedFN($event)">
  </chat-conversation-footer>

</div>


</div>
