<emoji-mart id="emoji-mart"
    class="emoji-mart"
    [showPreview]="$safeNavigationMigration(emojiiOptions?.showPreview)"
    [color]="$safeNavigationMigration(stylesMap?.get('themeColor'))" 
    [perLine]="$safeNavigationMigration(emojiiOptions?.emojiPerLine)"
    [totalFrequentLines]="$safeNavigationMigration(emojiiOptions?.totalFrequentLines)"
    [enableSearch]="$safeNavigationMigration(emojiiOptions?.enableSearch)"
    [darkMode]="$safeNavigationMigration(emojiiOptions?.darkMode)"
    [include]="$safeNavigationMigration(emojiiOptions?.include)"
    (emojiSelect)="addEmojiFN($event)">
</emoji-mart>
