<div id='c21-app-list-conversations' role="list">
  @for (conversation of listConversations | slice:0:limit; track conversation) {
    <div role="listitem">
      <button type="button"
        class="c21-item-conversation"
        [attr.aria-label]="conversation?.sender_fullname + ': ' + conversation.last_message_text"
        (click)="openConversationByID(conversation)">
        <div class="c21-body-conv">
          <div class="c21-left-conv">
            <div class="c21-ball" [ngStyle]="{'background': isImageLoaded(conversation) ? 'transparent' : 'linear-gradient(rgb(255,255,255) -125%, ' + conversation.color + ')'}">
              @if (!isImageLoaded(conversation)) {
                <span class="c21-ball-label" aria-hidden="true">{{conversation?.avatar}}</span>
              }
              @if (conversation?.image) {
                <img
                  [src]="conversation.image"
                  alt=""
                  style="display: none;"
                  (load)="onImageLoad(conversation)"
                  (error)="onImageError(conversation)">
              }
              @if (isImageLoaded(conversation)) {
                <div #avatarImage class="c21-avatar-image" [style.background-image]="'url(' + conversation.image + ')'"></div>
              }
            </div>
          </div>
          <div class="c21-right-conv">
            <div class="c21-last-time">{{$safeNavigationMigration(conversation?.timestamp) | dateAgo}}</div>
            <div class="truncate c21-name">{{conversation?.sender_fullname }}</div>
            <!-- --- IMAGE PREVIEW ICON ---- -->
            @if (conversation?.type ==='image') {
              <div [class.not-read]="conversation?.is_new" class="c21-msg" style="float: left; margin-right: 5px;">
                <chat-icon name="image" [color]="'#000000'"></chat-icon>
              </div>
            }
            <!-- --- ATTACHMENT ICON ---- -->
            @if (conversation.type !== 'image' && conversation.type !== 'text') {
              <div [class.not-read]="conversation.is_new" class="c21-msg" style="float: left; margin-right: 5px;">
                <chat-icon name="paperclip" [color]="'#000000'"></chat-icon>
              </div>
            }
            <!-- --- LAST MESSAGE ---- -->
            <div [class.not-read]="conversation.is_new" [class.archived]="conversation.archived" class="truncate c21-msg">{{conversation.last_message_text}}</div>
          </div>
          @if (conversation.is_new) {
            <div [ngStyle]="{ 'background-color': stylesMap.get('themeColor') }" class="c21-divBudge" aria-hidden="true">{{conversation.badge}}</div>
          }
          @if (conversation.archived) {
            <div class="c21-icon-archived-chat">
              <span class="c21-header-button c21-right c21-close" [attr.aria-label]="translationMap.get('CLOSED')" role="img">
                <chat-icon name="history" class="icon-lg" [color]="'#aaaaaa'"></chat-icon>
              </span>
            </div>
          }
        </div>
        <div class="clear"></div>
      </button>
    </div>
  }
</div>
