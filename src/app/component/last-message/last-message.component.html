@if (g.isOpenNewMessage) {
  <div id="messagePreview">
    @for (message of messages; track message; let i = $index; let isFirst = $first; let last = $last) {
      <div class="message-wrp" #message_wrp>
        <!-- message recipient:: -->
        @if (isFirst) {
          <div class="headerPreviewMessage">
            <div class="boxButtons">
              <!-- <div role="button" tabindex="0" class="buttonMore" (click)="openConversationByID(conversation)">
              <span>View more</span>
            </div> -->
            <button type="button"
              aria-label="Dismiss"
              class="buttonClose c21-button-clean"
              (click)="closeMessagePreview()">
              <span>
                <svg aria-hidden="true" focusable="false" height="20px" viewBox="0 0 24 24" width="20px" xmlns="http://www.w3.org/2000/svg" style="fill: rgb(255, 255, 255);">
                  <path d="M0 0h24v24H0V0z" fill="none"></path>
                  <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"></path>
                </svg>
              </span>
            </button>
          </div>
        </div>
      }
      <div class="container">
        <button type="button"
          class="previewNewMessagge c21-button-clean"
          [attr.aria-label]="g.START_A_CONVERSATION"
          (click)="openConversationByID(conversation)"
          [class.left-indicator]="isFirst && (!isImage(message) || isFrame(message))"
          [class.no-background]="(isImage(message) || isFrame(message)) && message?.text?.trim() === ''">
          <chat-bubble-message class="messages no-background"
            [class.emoticon]="isEmojii($safeNavigationMigration(message?.text))"
            [ngClass]="{'button-in-msg' : message?.metadata && message?.metadata?.button}"
            [message]="message"
            [isSameSender]="isSameSender($safeNavigationMigration(message?.sender), i)"
            [fontColor]="stylesMap.get('bubbleReceivedTextColor')"
            [stylesMap]="stylesMap"
            (onElementRendered)="onElementRenderedFN($event)">
          </chat-bubble-message>
          @if (isFirst) {
            <div class="c21-icon-avatar">
              <div class="c21-avatar-image profile_image">
                <chat-avatar-image class="slide-in-left"
                  [senderID]="$safeNavigationMigration(message?.sender)"
                  [senderFullname]="$safeNavigationMigration(message?.sender_fullname)"
                  [baseLocation]="baseLocation">
                </chat-avatar-image>
              </div>
            </div>
          }
        </button>
        @if (message?.attributes && message?.attributes?.attachment && last) {
          <div class="conversations-buttons">
            <chat-message-attachment
              style="height: 100%; display: block;"
              [message]="message"
              [isLastMessage] = "true"
              [limit]="3"
              [stylesMap]="stylesMap"
              (onAttachmentButtonClicked)="onAttachmentButtonClicked($event)">
            </chat-message-attachment>
          </div>
        }
      </div>
    </div>
  }
</div>
}
