<div id='c21-menu-options'>
  <button type="button"
    class="button-menu-options c21-button-clean"
    [attr.aria-label]="g.OPTIONS"
    [attr.aria-expanded]="g.isOpenMenuOptions ? 'true' : 'false'"
    aria-haspopup="true"
    (click)="f21_toggle_options()"
    (mouseover)="isHover=true"
    (mouseleave)="isHover=false">
    <chat-icon name="settings" class="icon-lg icon-menu" [style.display]="(isHover || g.isOpenMenuOptions) ? 'inline-flex' : 'none'"></chat-icon>
  </button>
  @if (g.isOpenMenuOptions) {
    <div
      class="modal-menu-options"
      role="group"
      [attr.aria-label]="g.OPTIONS"
      (keydown.escape)="$event.preventDefault(); $event.stopPropagation(); f21_toggle_options()">
      <div class="">
        <button type="button"
          class="c21-button c21-button-clean"
          [attr.aria-pressed]="g.soundEnabled ? 'true' : 'false'"
          [attr.aria-label]="g.soundEnabled ? g.SOUND_ON : g.SOUND_OFF"
          (click)="toggleSound()">
          @if (!g.soundEnabled) {
            <chat-icon name="volume-x" class="icon-menu"></chat-icon>
          }
          @if (g.soundEnabled) {
            <chat-icon name="volume-2" class="icon-menu"></chat-icon>
          }
          @if (!g.soundEnabled) {
            <span class="label-menu-item"> {{g.SOUND_OFF}}</span>
          }
          @if (g.soundEnabled) {
            <span class="label-menu-item"> {{g.SOUND_ON}}</span>
          }
        </button>
        @if (g.isLogged && g.showLogoutOption) {
          <button type="button"
            class="c21-button c21-button-clean"
            [attr.aria-label]="g.LOGOUT"
            (click)="signOut()">
            <chat-icon name="log-out" class="icon-menu"></chat-icon>
            @if (g.isLogged && g.showLogoutOption) {
              <span class="label-menu-item"> {{g.LOGOUT}}</span>
            }
          </button>
        }
        <div class="c21-button build_version_menu">
          <span class="label-menu-item"> {{g.BUILD_VERSION}}</span>
        </div>
      </div>
    </div>
  }
