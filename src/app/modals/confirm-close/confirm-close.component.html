<div class="modal-container"
  role="dialog"
  aria-modal="true"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="true"
  aria-labelledby="confirm-close-title"
  [attr.aria-label]="translationMap?.get('CONFIRM_CLOSE_CHAT')">
  <div class="header">
    <!-- ICON CLOSE CHAT -->
    <button type="button"
      class="c21-header-button c21-right c21-close c21-button-clean"
      [attr.aria-label]="translationMap?.get('CLOSE')"
      (click)="onBack()">
      <chat-icon name="close" class="icon-lg" [color]="$safeNavigationMigration(stylesMap?.get('themeColor'))"></chat-icon>
    </button>
  </div>
  <div class="content">
    <h2 id="confirm-close-title" class="text">{{ translationMap?.get('CONFIRM_CLOSE_CHAT') }}</h2>
    <div class="options">

      <!-- BUTTON CANCEL-->
      <button type="button"
        class="c21-button-clean v-align-center c21-label-button back-button"
        [class.disabled]="isLoadingActive"
        [attr.disabled]="isLoadingActive ? true : null"
        (click)="onBack()">
        {{translationMap?.get('BACK')}}
      </button>

      <!-- BUTTON CLOSE-->
      <button type="button" aflistconv #aflistconv class="c21-button-primary" (click)="onConfirm()" [ngStyle]="{'background-color': $safeNavigationMigration(stylesMap?.get('themeColor')), 'border-color': $safeNavigationMigration(stylesMap?.get('themeColor')), 'color': $safeNavigationMigration(stylesMap?.get('foregroundColor')) }">
        @if (isLoadingActive) {
          <span class="spinner-container">
            <chat-icon name="loader-circle" class="spin" [size]="25" [color]="$safeNavigationMigration(stylesMap?.get('foregroundColor'))"></chat-icon>
          </span>
        }
        <span class="v-align-center c21-label-button">
          {{translationMap?.get('CLOSE_CHAT')}}
        </span>
        <div class="clear"></div>
      </button>
    </div>
  </div>
</div>
